    tags: ["modern", "grpc", "protobuf", "2026"]
    severity_hint: "critical"

  - id: "modern-014"
    name: "Cloudflare Workers fetch SSRF"
    category: "modern"
    payload: "http://169.254.169.254/latest/meta-data/"
    description: >
