    tags: ["modern", "http2", "parser-differential", "2026"]
    severity_hint: "critical"

  - id: "modern-011"
    name: "AI/LLM tool-call SSRF"
    category: "modern"
    payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
    description: >
