    description: "Windows-style backslash URL — normalised to // by Windows parsers."
    tags: ["waf_bypass", "backslash", "windows"]
    severity_hint: "high"

  - id: "waf-013"
    name: "ASCII control character in authority"
    category: "waf_bypass"
