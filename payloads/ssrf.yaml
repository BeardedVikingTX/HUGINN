    tags: ["modern", "cloudflare", "edge", "2026"]
    severity_hint: "critical"

  - id: "modern-015"
    name: "Deno/Node undici backslash bypass"
    category: "modern"
    payload: "http:\\\\169.254.169.254\\"
    description: >
      Undici's URL parser accepts backslashes as slashes — bypasses
